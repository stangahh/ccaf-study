      B: "This describes a different concept — goal drift in multi-step workflows. The 'lost in the middle' effect is specifically about attention quality on long inputs.",
      C: "There is no documented 'half-full context window' performance phenomenon. The effect is about POSITION within the input, not context window fill level.",
      D: "This would be an exam performance phenomenon, not a property of language model attention. The effect refers to position within a single input/prompt."
    },
    studyLinks: [{ text: "Context Window Management", anchor: "d5-context" }],
    docLinks: []
  },
  {
    id: 55, domain: 5,
    question: "A subagent encounters a transient failure (database connection timeout). What is the correct handling strategy?",
    options: [
      { id: 'A', text: "Attempt local recovery (retry with backoff). If unresolvable, propagate structured error context including failure type, what was attempted, and partial results." },
      { id: 'B', text: "Immediately propagate the raw exception to the coordinator for centralized handling." },
      { id: 'C', text: "Silently retry 3 times, then return an empty result set marked as successful if all retries fail." },
      { id: 'D', text: "Return a generic 'service unavailable' status to the coordinator." }
    ],
    correct: 'A',
    explanation: "Transient failures should be handled locally first — the subagent retries with appropriate backoff since it has the context to determine retry strategy. Only if local recovery fails should it propagate to the coordinator, with structured context (failure type, attempted query, partial results, alternatives tried). This gives the coordinator what it needs for intelligent recovery decisions.",
    whyWrong: {
      B: "Immediately propagating transient failures to the coordinator adds coordination overhead and loses the subagent's ability to handle the common case (retry succeeds) locally.",
      C: "Returning empty results as success is the 'silent suppression' anti-pattern — the coordinator proceeds thinking the search found nothing when actually it failed.",
      D: "Generic 'service unavailable' hides valuable context (what was attempted, partial results) that the coordinator needs for recovery decisions."
    },
    studyLinks: [{ text: "Error Propagation", anchor: "d5-errors" }],
    docLinks: []
  }
];

// ── State ──
let questions = [];
let currentIdx = 0;
let answered = {};
let domainFilter = 'all';

// ── DOM ──
const questionArea = document.getElementById('question-area');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const qCounter = document.getElementById('q-counter');
const progressFill = document.getElementById('progress-fill');
const scoreDisplay = document.getElementById('score-display');
const domainFilterEl = document.getElementById('domain-filter');
const shuffleToggle = document.getElementById('shuffle-toggle');
const restartBtn = document.getElementById('restart-btn');
const resultsArea = document.getElementById('results-area');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterQuestions() {
  let q = domainFilter === 'all' ? [...QUESTIONS] : QUESTIONS.filter(q => q.domain === parseInt(domainFilter));
  if (shuffleToggle.checked) q = shuffle(q);
  return q;
}

function domainColor(d) {
  return ['','var(--d1)','var(--d2)','var(--d3)','var(--d4)','var(--d5)'][d] || '#888';
}

function domainBadgeClass(d) {
  return ['','d1-badge','d2-badge','d3-badge','d4-badge','d5-badge'][d] || '';
}

function domainName(d) {
  return ['','Agentic Architecture','Tool Design & MCP','Claude Code Config','Prompt Engineering','Context & Reliability'][d] || '';
}

function getScore() {
  let correct = 0;
  Object.keys(answered).forEach(idx => {
    const q = questions[parseInt(idx)];
    if (answered[idx] === q.correct) correct++;
  });
  return { correct, total: Object.keys(answered).length };
}

function renderQuestion(idx) {
  const q = questions[idx];
  if (!q) return;
  const isAnswered = answered[idx] !== undefined;
  const selected = answered[idx];

  const officialTag = q.official ? '<span class="scenario-tag">Official Sample Question</span>' : '';
  const scenarioTag = q.scenario ? `<span class="scenario-tag">📋 ${q.scenario}</span>` : '';

  let optionsHtml = q.options.map(opt => {
    let cls = 'option-btn';
    if (isAnswered) {
      if (opt.id === q.correct) cls += ' revealed-correct';
      if (opt.id === selected && selected !== q.correct) cls += ' incorrect';
      if (opt.id === selected && selected === q.correct) cls = 'option-btn correct';
    }
    return `<button class="${cls}" data-id="${opt.id}" ${isAnswered ? 'disabled' : ''}>
      <span class="option-letter">${opt.id}</span>
      <span>${opt.text}</span>
    </button>`;
  }).join('');

  let explanationHtml = '';
  if (isAnswered) {
    const isRight = selected === q.correct;
    const wrongOptions = q.options.filter(o => o.id !== q.correct && o.id !== selected);
    let whyWrongHtml = '';
    if (q.whyWrong) {
      const entries = Object.entries(q.whyWrong);
      whyWrongHtml = `<div class="why-wrong">
        <div style="font-weight:600;font-size:0.8rem;margin-bottom:0.375rem;color:var(--text-muted);">Why the others are wrong:</div>
        ${entries.map(([k, v]) => `<div class="why-wrong-item">
          <span class="why-wrong-letter ${k === q.correct ? 'why-wrong-correct' : ''}">${k})</span>
          <span>${v}</span>
        </div>`).join('')}
      </div>`;
    }

    let studyLinksHtml = '';
    if (q.studyLinks && q.studyLinks.length > 0) {
      studyLinksHtml = `<div class="study-links">
        <span class="study-link-label">Study this →</span>
        ${q.studyLinks.map(l => `<a href="study.html#${l.anchor}" class="study-link" target="_blank">${l.text}</a>`).join('')}
        ${q.docLinks && q.docLinks.length > 0 ? q.docLinks.map(l => `<a href="${l.url}" class="doc-link" target="_blank" style="font-size:0.78rem;">${l.text}</a>`).join('') : ''}
      </div>`;
    }

    explanationHtml = `<div class="explanation show">
      <div class="explanation-header">${isRight ? '✓ Correct!' : '✗ Incorrect — Correct answer: ' + q.correct}</div>
      <p style="margin-bottom:0.5rem;">${q.explanation}</p>
      ${whyWrongHtml}
      ${studyLinksHtml}
    </div>`;
  }

  questionArea.innerHTML = `<div class="question-card">
    <div class="question-meta">
      <span class="q-num">Q${idx + 1} of ${questions.length}</span>
      <span class="domain-badge ${domainBadgeClass(q.domain)}" style="font-size:0.72rem;">D${q.domain} · ${domainName(q.domain)}</span>
      ${officialTag}
      ${scenarioTag}
    </div>
    <div class="question-text">${q.question}</div>
    <div class="options">${optionsHtml}</div>
    ${explanationHtml}
  </div>`;

  // Attach click handlers
  if (!isAnswered) {
    questionArea.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(idx, btn.dataset.id));
    });
  }

  updateNav();
}

function handleAnswer(idx, optId) {
  answered[idx] = optId;
  const { correct, total } = getScore();
  const progress = ((idx + 1) / questions.length) * 100;
  progressFill.style.width = progress + '%';
  scoreDisplay.textContent = `${correct} / ${total}`;
  renderQuestion(idx);
}

function updateNav() {
  prevBtn.disabled = currentIdx === 0;
  nextBtn.disabled = currentIdx >= questions.length - 1;
  qCounter.textContent = `${currentIdx + 1} / ${questions.length}`;

  // Show results if on last question and answered
  if (currentIdx === questions.length - 1 && answered[currentIdx] !== undefined) {
    nextBtn.disabled = true;
    showResults();
  }
}

function showResults() {
  const { correct, total } = getScore();
  const pct = Math.round((correct / questions.length) * 100);
  const scaled = Math.round((correct / questions.length) * 900 + 100);
  const pass = scaled >= 720;

  resultsArea.style.display = 'block';
  resultsArea.innerHTML = `<div class="concept-card" style="text-align:center;padding:2rem;">
    <h2 style="margin-top:0;">Results</h2>
    <div class="score-ring ${pass ? 'pass' : 'fail'}" style="margin:1rem auto;">
      <span class="score-pct" style="color:${pass ? 'var(--correct)' : 'var(--incorrect)'};">${pct}%</span>
      <span class="score-label">${correct}/${questions.length}</span>
    </div>
    <p><strong>Scaled Score:</strong> ~${scaled} / 1000 ${pass ? '✓ PASS' : '✗ Below 720'}</p>
    <p class="text-muted text-sm">Score is approximate. Real exam uses calibrated scaling.</p>
    <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="location.reload()">Restart Exam</button>
      <a href="study.html" class="btn btn-secondary">Back to Study Guide</a>
    </div>
  </div>`;
  resultsArea.scrollIntoView({ behavior: 'smooth' });
}

function init() {
  answered = {};
  currentIdx = 0;
  questions = filterQuestions();
  resultsArea.style.display = 'none';
  resultsArea.innerHTML = '';
  progressFill.style.width = '0%';
  scoreDisplay.textContent = '0 / 0';
  renderQuestion(0);
}

prevBtn.addEventListener('click', () => {
  if (currentIdx > 0) { currentIdx--; renderQuestion(currentIdx); }
});

nextBtn.addEventListener('click', () => {
  if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(currentIdx); }
});

domainFilterEl.addEventListener('change', () => {
  domainFilter = domainFilterEl.value;
  init();
});

restartBtn.addEventListener('click', init);
shuffleToggle.addEventListener('change', init);

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) { currentIdx++; renderQuestion(currentIdx); }
  if (e.key === 'ArrowLeft' && !prevBtn.disabled) { currentIdx--; renderQuestion(currentIdx); }
  const q = questions[currentIdx];
  if (!answered[currentIdx] && q) {
    const map = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', 'a': 'A', 'b': 'B', 'c': 'C', 'd': 'D' };
    if (map[e.key]) handleAnswer(currentIdx, map[e.key]);
  }
});

init();
</script>
</body>
</html>
